<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>SpotifyKids</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SpotifyKids">
  <!-- Bump ?v= whenever the icon image changes — helps Safari's favicon
       cache pick up the change; iOS's already-installed home-screen icon
       is a one-time snapshot from "Add to Home Screen" and may still need
       a manual remove-and-re-add regardless. -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="api.js"></script>
  <script src="player.js"></script>
  <script src="app.js"></script>
  <script src="update-check.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
</body>
</html>
